; PlatformIO Project Configuration File
; Arduino UNO R4 WiFi - LED & Touch Controller
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor

[platformio]
src_dir = src
include_dir = include

[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino

; Libraries
lib_deps = 
    adafruit/Adafruit NeoPixel@^1.12.0
    adafruit/Adafruit CAP1188 Library@^1.1.3

lib_ignore = I2S

; Serial monitor
monitor_speed = 115200
monitor_eol = LF
monitor_echo = yes
monitor_filters = send_on_enter

; Build flags
build_flags = 
    -D NUM_LEDS_STRIP1=190
    -D NUM_LEDS_STRIP2=190
